volumes:
    cineflow-frontend-data:
        name: ${CINEFLOW_FRONTEND_VOLUME:-cineflow-frontend-data}

services:
    cineflow-frontend:
        image: coldspirit/cineflow-frontend:dev # Tags: latest/dev/x.x.x
        build:
            context: .
            dockerfile: Dockerfile
        container_name: cineflow-frontend
        restart: unless-stopped
        env_file:
            - .env # Load environment variables from .env file. Read .env.example

        # or set individual environment variables here, both methods can be used together, the ones set here will override those in the .env file if present
        environment:
            - TZ=Asia/Kolkata

        # Uncomment the following if you plan to bind the port to the host machine
        expose:
            - 3000

        # (Optional) Uncomment the following lines to bind the port to the host machine
        # ports:
        #   - 3000:3000
        volumes:
            # Set CINEFLOW_FRONTEND_VOLUME=riven-frontend-data to reuse the legacy volume.
            - cineflow-frontend-data:/riven/data # Persistent data storage
