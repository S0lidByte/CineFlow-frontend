name: Free PR Reviewers

on:
    pull_request:
        types: [opened, synchronize, reopened]

permissions:
    contents: read

concurrency:
    group: free-pr-reviewers-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    actionlint:
        name: reviewdog / GitHub Actions
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: write
        steps:
            - uses: actions/checkout@v5
              with:
                  persist-credentials: false
            - uses: reviewdog/action-actionlint@v1
              with:
                  reporter: github-pr-review
                  filter_mode: added
                  fail_level: none

    security:
        name: reviewdog / Semgrep OSS
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: write
        steps:
            - uses: actions/checkout@v5
              with:
                  persist-credentials: false
            - uses: actions/setup-python@v6
              with:
                  python-version: "3.12"
            - name: Install free Semgrep CLI
              run: python -m pip install "semgrep>=1.160,<2"
            - name: Scan locally using public security rules (no source upload)
              run: semgrep scan --config p/security-audit --metrics=off --sarif --output semgrep.sarif .
            - uses: reviewdog/action-setup@v1
            - name: Add inline PR security findings
              env:
                  REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: reviewdog -f=sarif -name=semgrep -reporter=github-pr-review -filter-mode=added -fail-level=none < semgrep.sarif

    eslint:
        name: ESLint (Run)
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v5
              with:
                  persist-credentials: false
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v5
              with:
                  node-version: "22"
                  cache: pnpm
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Run ESLint and output report
              run: |
                  pnpm exec eslint -f json --output-file eslint.json . || true
                  node -e 'const fs = require("fs"); const path = require("path"); const results = JSON.parse(fs.readFileSync("eslint.json", "utf8")); const rdjson = { source: { name: "eslint", url: "https://eslint.org/" }, diagnostics: [] }; for (const res of results) { const relPath = path.relative(process.cwd(), res.filePath).replace(/\\/g, "/"); for (const msg of res.messages || []) { rdjson.diagnostics.push({ message: msg.message, location: { path: relPath, range: { start: { line: msg.line || 1, column: msg.column || 1 }, end: { line: msg.endLine || msg.line || 1, column: msg.endColumn || msg.column || 1 } } }, severity: msg.severity === 2 ? "ERROR" : msg.severity === 1 ? "WARNING" : "INFO", code: { value: msg.ruleId || "eslint" } }); } } fs.writeFileSync("eslint-rdjson.json", JSON.stringify(rdjson));'
            - uses: actions/upload-artifact@v4
              with:
                  name: eslint-rdjson
                  path: eslint-rdjson.json
                  retention-days: 1

    eslint-report:
        name: reviewdog / ESLint
        needs: eslint
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: write
        steps:
            - uses: actions/checkout@v5
              with:
                  persist-credentials: false
            - uses: actions/download-artifact@v4
              with:
                  name: eslint-rdjson
            - uses: reviewdog/action-setup@v1
            - name: Add inline PR ESLint findings
              env:
                  REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: reviewdog -f=rdjson -name=eslint -reporter=github-pr-review -filter-mode=added -fail-level=none < eslint-rdjson.json
