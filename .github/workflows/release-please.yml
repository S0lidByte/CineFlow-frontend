name: Release Please

on:
    push:
        branches:
            - main

permissions:
    contents: write
    pull-requests: write

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    release-please:
        runs-on: ubuntu-latest
        outputs:
            pr: ${{ steps.release.outputs.pr }}
        steps:
            - uses: googleapis/release-please-action@v4
              id: release

    # release-please writes CHANGELOG.md without our Prettier rules (md printWidth 70).
    # Format and commit via the Contents API so the commit is GitHub-verified
    # (repo ruleset requires signed commits; raw git commit/push is unsigned).
    format-changelog:
        needs: release-please
        if: ${{ needs.release-please.outputs.pr }}
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        steps:
            - name: Resolve release PR branch
              id: branch
              env:
                  PR_JSON: ${{ needs.release-please.outputs.pr }}
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail
                  BRANCH="$(printf '%s' "$PR_JSON" | jq -r '.headBranchName // .head.ref // empty')"
                  if [ -z "$BRANCH" ] || [ "$BRANCH" = "null" ]; then
                    PR_NUMBER="$(printf '%s' "$PR_JSON" | jq -r '.number // empty')"
                    if [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ]; then
                      BRANCH="$(gh pr view "$PR_NUMBER" --json headRefName -q .headRefName)"
                    fi
                  fi
                  if [ -z "$BRANCH" ] || [ "$BRANCH" = "null" ]; then
                    echo "Could not resolve release PR branch from: $PR_JSON"
                    exit 1
                  fi
                  echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

            - name: Checkout release PR branch
              uses: actions/checkout@v4
              with:
                  ref: ${{ steps.branch.outputs.name }}
                  token: ${{ secrets.GITHUB_TOKEN }}
                  fetch-depth: 0

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install

            - name: Format CHANGELOG.md and commit via API if needed
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  BRANCH: ${{ steps.branch.outputs.name }}
              run: |
                  set -euo pipefail
                  pnpm exec prettier --write CHANGELOG.md
                  if git diff --quiet CHANGELOG.md; then
                    echo "CHANGELOG.md already formatted"
                    exit 0
                  fi

                  # Contents API commits are GitHub-signed (required by branch ruleset).
                  FILE_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/contents/CHANGELOG.md?ref=${BRANCH}" --jq .sha)"
                  CONTENT_B64="$(base64 -w0 CHANGELOG.md)"
                  gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/CHANGELOG.md" \
                    -f message="style(lint): format CHANGELOG.md with prettier" \
                    -f content="${CONTENT_B64}" \
                    -f branch="${BRANCH}" \
                    -f sha="${FILE_SHA}"
