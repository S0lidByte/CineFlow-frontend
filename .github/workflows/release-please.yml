name: Release Please

on:
    push:
        branches:
            - main

permissions:
    contents: write
    pull-requests: write

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    release-please:
        runs-on: ubuntu-latest
        outputs:
            pr: ${{ steps.release.outputs.pr }}
        steps:
            - uses: googleapis/release-please-action@v4
              id: release

    # release-please writes CHANGELOG.md without our Prettier rules (md printWidth 70).
    # Format and push so Lint on the release PR does not fail every time.
    format-changelog:
        needs: release-please
        if: ${{ needs.release-please.outputs.pr }}
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        steps:
            - name: Resolve release PR branch
              id: branch
              env:
                  PR_JSON: ${{ needs.release-please.outputs.pr }}
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail
                  BRANCH="$(printf '%s' "$PR_JSON" | jq -r '.headBranchName // .head.ref // empty')"
                  if [ -z "$BRANCH" ] || [ "$BRANCH" = "null" ]; then
                    PR_NUMBER="$(printf '%s' "$PR_JSON" | jq -r '.number // empty')"
                    if [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ]; then
                      BRANCH="$(gh pr view "$PR_NUMBER" --json headRefName -q .headRefName)"
                    fi
                  fi
                  if [ -z "$BRANCH" ] || [ "$BRANCH" = "null" ]; then
                    echo "Could not resolve release PR branch from: $PR_JSON"
                    exit 1
                  fi
                  echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

            - name: Checkout release PR branch
              uses: actions/checkout@v4
              with:
                  ref: ${{ steps.branch.outputs.name }}
                  token: ${{ secrets.GITHUB_TOKEN }}
                  fetch-depth: 0

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install

            - name: Format CHANGELOG.md and commit if needed
              run: |
                  set -euo pipefail
                  pnpm exec prettier --write CHANGELOG.md
                  if git diff --quiet CHANGELOG.md; then
                    echo "CHANGELOG.md already formatted"
                    exit 0
                  fi
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add CHANGELOG.md
                  git commit -m "style(lint): format CHANGELOG.md with prettier"
                  git push
